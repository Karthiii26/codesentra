services:
  - type: web
    name: codesentra
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: codesentra-web
    runtime: static
    plan: free
    region: oregon
    staticPublishPath: ./src/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
